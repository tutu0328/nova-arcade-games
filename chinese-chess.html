<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#261a12">
  <title>星河象棋 · NOVA ARCADE</title>
  <style>
    :root{
      --ink:#2a1409;--paper:#f6dfb5;--board:#d99b53;--line:#6c3417;
      --red:#c5221f;--black:#1d2028;--gold:#ffd16a;--jade:#3db27f;
      --panel:rgba(255,246,225,.9);--shadow:0 22px 70px rgba(47,20,4,.28)
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#160f0b;color:var(--ink);font-family:Arial,"PingFang SC",sans-serif}
    body{background:
      radial-gradient(circle at 18% 10%,rgba(255,209,106,.24),transparent 26%),
      radial-gradient(circle at 88% 12%,rgba(61,178,127,.16),transparent 25%),
      linear-gradient(160deg,#1a0f0b 0,#3a1e12 44%,#120c0a 100%)}
    button,a{font:inherit;color:inherit}button{cursor:pointer}a{text-decoration:none}
    .topbar{min-height:66px;padding:12px clamp(14px,4vw,46px);display:flex;align-items:center;gap:18px;color:#ffeecb;border-bottom:1px solid rgba(255,255,255,.14);background:rgba(20,12,8,.72);backdrop-filter:blur(14px);position:sticky;top:0;z-index:10}
    .back{color:#d9bd91;font-size:13px}.back:hover{color:#fff}
    .brand{font-weight:900;letter-spacing:.14em}.brand span{color:var(--gold)}
    .hud{margin-left:auto;display:flex;gap:18px;font-size:12px;color:#d9bd91}.hud b{display:block;color:#fff6db;font-size:15px;margin-top:3px}
    main{width:min(1220px,calc(100% - 28px));margin:28px auto 64px;display:grid;grid-template-columns:minmax(330px,.76fr) minmax(390px,1fr);gap:20px;align-items:start}
    .panel{border:1px solid rgba(255,255,255,.18);background:var(--panel);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
    .controls{padding:22px}.kicker{font-size:11px;letter-spacing:.18em;color:#8a512c;font-weight:900}
    h1,h2,p{margin:0}h1{font-size:clamp(36px,7vw,68px);line-height:.9;letter-spacing:-.06em;margin:12px 0;color:#fff0c8;text-shadow:4px 5px 0 rgba(0,0,0,.24)}
    .hero-copy{color:#e5cda7;line-height:1.75;margin-bottom:18px}
    .control-block{border-top:1px solid rgba(104,55,22,.18);padding-top:18px;margin-top:18px}
    .control-block h2{font-size:16px;margin-bottom:10px}
    .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.seg.three{grid-template-columns:repeat(3,1fr)}.seg.levels,.seg.profiles{grid-template-columns:repeat(auto-fit,minmax(74px,1fr))}
    .seg button,.action{border:1px solid rgba(104,55,22,.28);border-radius:10px;background:#fff8e9;padding:11px 10px;font-weight:800;color:#553015}
    .seg button.active{background:#2b1a10;color:#fff1ca;border-color:#2b1a10}
    .seg button:disabled{opacity:.45;cursor:not-allowed}
    .action{width:100%;margin-top:10px;background:linear-gradient(90deg,var(--gold),#ff9d52)}
    .action.secondary{background:#fff8e9}
    .info{display:grid;gap:10px;margin-top:14px}.info-card{padding:13px;border:1px solid rgba(104,55,22,.18);border-radius:10px;background:rgba(255,255,255,.42);line-height:1.55}
    .info-card small{display:block;color:#8a512c;font-weight:900;margin-bottom:5px}.captured{min-height:42px;font-size:22px;letter-spacing:.12em;word-break:break-all}
    .stage{padding:18px;background:linear-gradient(180deg,#f2bd70,#d58d45)}
    .board-wrap{position:relative;margin:auto;width:min(100%,720px);aspect-ratio:9/10;border:12px solid #693314;border-radius:12px;background:linear-gradient(145deg,#f2bd70,#cc833e);box-shadow:inset 0 0 0 5px rgba(255,238,184,.45),0 16px 42px rgba(0,0,0,.28);overflow:hidden}
    .board{position:absolute;inset:14px;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(10,1fr);border-left:2px solid var(--line);border-top:2px solid var(--line)}
    .cell{position:relative;border-right:2px solid rgba(92,44,18,.88);border-bottom:2px solid rgba(92,44,18,.88);background:rgba(255,255,255,.04)}
    .cell.palace-red{background:linear-gradient(135deg,rgba(208,48,31,.36),rgba(255,210,112,.28));box-shadow:inset 0 0 0 2px rgba(208,48,31,.34)}
    .cell.palace-black{background:linear-gradient(135deg,rgba(46,36,28,.42),rgba(255,224,152,.22));box-shadow:inset 0 0 0 2px rgba(46,36,28,.34)}
    .cell.river{background:rgba(255,225,146,.22)}
    .river-label{position:absolute;z-index:2;left:14px;right:14px;top:50%;height:10%;transform:translateY(-50%);display:grid;grid-template-columns:1fr 1fr;align-items:center;text-align:center;pointer-events:none;background:linear-gradient(90deg,rgba(255,231,168,.68),rgba(246,196,103,.82),rgba(255,231,168,.68));border-top:3px solid rgba(92,44,18,.72);border-bottom:3px solid rgba(92,44,18,.72);box-shadow:0 0 18px rgba(87,36,11,.16)}
    .river-label span{font-family:Georgia,"Songti SC","SimSun",serif;font-size:clamp(24px,4.5vw,46px);font-weight:900;color:rgba(104,50,18,.72);letter-spacing:.28em;text-shadow:0 1px 0 rgba(255,240,190,.7)}
    .palace-lines{position:absolute;z-index:2;left:calc(33.333% + 4.7px);width:calc(33.333% - 9.3px);height:calc(30% - 8.4px);pointer-events:none}
    .palace-lines.black{top:14px}.palace-lines.red{bottom:14px}
    .palace-lines:before,.palace-lines:after{content:"";position:absolute;left:0;top:50%;width:100%;height:2px;background:rgba(255,240,194,.72);transform-origin:center}
    .palace-lines:before{transform:rotate(45deg)}.palace-lines:after{transform:rotate(-45deg)}
    .cell.hint{background:rgba(61,178,127,.22)}.cell.capture{background:rgba(197,34,31,.22)}
    .piece{position:absolute;z-index:3;width:9.5%;aspect-ratio:1;border-radius:50%;border:3px solid currentColor;background:radial-gradient(circle at 35% 25%,#fff9e7,#f7d699 72%);display:grid;place-items:center;font-size:clamp(18px,4.6vw,36px);font-weight:900;transform:translate(-50%,-50%);box-shadow:0 8px 18px rgba(52,21,6,.28);transition:.16s}
    .piece.red{color:var(--red)}.piece.black{color:var(--black)}.piece.selected{outline:4px solid var(--jade);box-shadow:0 0 0 7px rgba(61,178,127,.18),0 8px 18px rgba(52,21,6,.28)}
    .piece.ai-turn{opacity:.8}
    .status{margin-top:14px;padding:15px 16px;border-radius:10px;background:#2b1a10;color:#fff0cf;line-height:1.6;display:flex;justify-content:space-between;gap:16px;align-items:center}
    .status b{color:var(--gold)}
    .log{max-height:180px;overflow:auto;padding:16px;background:#fff4d9}.log h2{font-size:15px;margin-bottom:10px}.log ol{margin:0;padding-left:22px;line-height:1.65;color:#6d4525}
    .win{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:18px;background:rgba(16,8,5,.72);backdrop-filter:blur(10px)}
    .win.show{display:grid}.win-card{width:min(480px,100%);padding:34px;border-radius:14px;background:#fff3d8;color:#2b1a10;text-align:center;box-shadow:var(--shadow)}.win-card h2{font-size:32px;margin-bottom:10px}.win-card p{line-height:1.7;color:#704626}
    @media(max-width:860px){main{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-wrap:wrap}.hud{margin-left:0;width:100%;justify-content:space-between}.stage{padding:10px}.board-wrap{border-width:7px}.board{inset:9px}.piece{border-width:2px}.status{display:block}.status span{display:block;margin-top:6px}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back" href="index.html">← 游戏库</a>
    <div class="brand">STAR RIVER <span>XIANGQI</span></div>
    <div class="hud">
      <div>模式<b id="modeHud">人机对战</b></div>
      <div>难度<b id="difficultyHud">普通</b></div>
      <div>回合<b id="turnHud">红方</b></div>
    </div>
  </header>

  <main>
    <section>
      <h1>星河象棋</h1>
      <p class="hero-copy">同屏双人可以直接轮流落子；人机模式可以选更多档位；匹配模式会按你的连胜连败安排对手。点自己的棋子，再点高亮位置就能走。</p>
      <div class="panel controls">
        <div class="kicker">PLAY MODE</div>
        <div class="control-block">
          <h2>对战方式</h2>
          <div class="seg three" id="modeButtons">
            <button class="active" data-mode="ai">人机对战</button>
            <button data-mode="match">匹配对战</button>
            <button data-mode="local">双人对战</button>
          </div>
        </div>
        <div class="control-block">
          <h2>人机难度</h2>
          <div class="seg levels" id="difficultyButtons">
            <button data-difficulty="novice">入门</button>
            <button data-difficulty="easy">新手</button>
            <button class="active" data-difficulty="normal">业余</button>
            <button data-difficulty="advanced">进阶</button>
            <button data-difficulty="hard">高手</button>
            <button data-difficulty="master">大师</button>
            <button data-difficulty="legend">宗师</button>
          </div>
        </div>
        <div class="control-block">
          <h2>AI 对手</h2>
          <div class="seg profiles" id="aiProfileButtons">
            <button class="active" data-ai-profile="standard">常规AI</button>
            <button data-ai-profile="doubao">豆包</button>
            <button data-ai-profile="deepseek">DeepSeek</button>
            <button data-ai-profile="codex">Codex</button>
            <button data-ai-profile="lobster">龙虾</button>
            <button data-ai-profile="aggressive">进攻AI</button>
            <button data-ai-profile="defensive">防守AI</button>
            <button data-ai-profile="endgame">残局AI</button>
            <button data-ai-profile="super">超级人机</button>
          </div>
        </div>
        <button class="action secondary" id="matchButton">开始匹配</button>
        <button class="action" id="newGame">重新开局</button>
        <button class="action secondary" id="undoMove">悔一步</button>
        <div class="info">
          <div class="info-card"><small>匹配状态</small><div id="matchStatus">未开始匹配。</div></div>
          <div class="info-card"><small>当前对手</small><div id="opponentInfo">人机对战 · 业余</div></div>
          <div class="info-card"><small>匹配战绩</small><div id="matchRecord">0 胜 0 负 · 连胜 0</div></div>
          <div class="info-card"><small>红方吃子</small><div class="captured" id="redCaptured">—</div></div>
          <div class="info-card"><small>黑方吃子</small><div class="captured" id="blackCaptured">—</div></div>
          <div class="info-card"><small>提示</small><div id="coach">红方先行。帅和将不能照面。</div></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="stage">
        <div class="board-wrap" id="boardWrap">
          <div class="board" id="board" aria-label="中国象棋棋盘"></div>
          <div class="river-label" aria-hidden="true"><span>楚河</span><span>汉界</span></div>
          <div class="palace-lines black" aria-hidden="true"></div>
          <div class="palace-lines red" aria-hidden="true"></div>
        </div>
        <div class="status">
          <div id="statusText"><b>红方</b> 请选择棋子。</div>
          <span id="checkText">未将军</span>
        </div>
      </div>
      <div class="log">
        <h2>棋谱</h2>
        <ol id="moveLog"></ol>
      </div>
    </section>
  </main>

  <section class="win" id="winnerLayer">
    <div class="win-card">
      <h2 id="winnerTitle">红方获胜</h2>
      <p id="winnerCopy">对局结束。</p>
      <button class="action" id="playAgain">再来一局</button>
    </div>
  </section>

  <script>
    const RED="r",BLACK="b";
    const pieceText={rk:"帅",ra:"仕",re:"相",rh:"马",rr:"车",rc:"炮",rp:"兵",bk:"将",ba:"士",be:"象",bh:"马",br:"车",bc:"炮",bp:"卒"};
    const pieceName={k:"将帅",a:"士仕",e:"象相",h:"马",r:"车",c:"炮",p:"兵卒"};
    const values={k:10000,r:900,c:460,h:430,e:230,a:230,p:100};
    const DIFFICULTIES=[
      {id:"novice",label:"入门",depth:0,top:10,random:.85,noise:130},
      {id:"easy",label:"新手",depth:0,top:7,random:.55,noise:80},
      {id:"normal",label:"业余",depth:0,top:4,random:.22,noise:35},
      {id:"advanced",label:"进阶",depth:1,top:4,random:.12,noise:22},
      {id:"hard",label:"高手",depth:2,top:3,random:.05,noise:12},
      {id:"master",label:"大师",depth:2,top:2,random:.02,noise:5},
      {id:"legend",label:"宗师",depth:3,top:1,random:0,noise:0},
      {id:"super",label:"超级人机",depth:3,top:1,random:0,noise:-15}
    ];
    const AI_PROFILES=[
      {id:"standard",label:"常规AI",style:"balanced",difficulty:"custom"},
      {id:"doubao",label:"豆包",style:"steady",difficulty:"advanced"},
      {id:"deepseek",label:"DeepSeek",style:"deep",difficulty:"master"},
      {id:"codex",label:"Codex",style:"tactical",difficulty:"legend"},
      {id:"lobster",label:"龙虾",style:"weird",difficulty:"hard"},
      {id:"aggressive",label:"进攻AI",style:"aggressive",difficulty:"advanced"},
      {id:"defensive",label:"防守AI",style:"defensive",difficulty:"hard"},
      {id:"endgame",label:"残局AI",style:"endgame",difficulty:"master"},
      {id:"super",label:"超级人机",style:"super",difficulty:"super"}
    ];
    const MATCH_KEY="star-river-xiangqi-match";
    const playerPool=[
      "江南棋客","北巷车王","云端炮手","河界少年","夜航棋士","青石巷阿七","松风残局","红马过河",
      "山城老将","天台棋社","半步将军","落子无声","楚河访客","汉界旅人","边兵不回头","巡河车手"
    ];
    const botPool=[
      {name:"补位人机-小卒",difficulty:"easy"},
      {name:"补位人机-巡河炮",difficulty:"normal"},
      {name:"补位人机-稳手马",difficulty:"advanced"},
      {name:"补位人机-守宫士",difficulty:"normal"}
    ];
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    const horseSteps=[[2,1,1,0],[2,-1,1,0],[-2,1,-1,0],[-2,-1,-1,0],[1,2,0,1],[-1,2,0,1],[1,-2,0,-1],[-1,-2,0,-1]];
    const elephantSteps=[[2,2,1,1],[2,-2,1,-1],[-2,2,-1,1],[-2,-2,-1,-1]];
    const advisorSteps=[[1,1],[1,-1],[-1,1],[-1,-1]];
    let board,turn,selected,moves,mode="ai",difficulty="normal",aiProfile="standard",history,gameOver,thinking=false,matchedOpponent=null,matchStatus="未开始匹配。";
    let matchStats=loadMatchStats();

    const $=id=>document.getElementById(id);
    const clone=b=>b.map(row=>row.map(p=>p?{...p}:null));
    const inside=(r,c)=>r>=0&&r<10&&c>=0&&c<9;
    const enemy=(p,side)=>p&&p.side!==side;
    const own=(p,side)=>p&&p.side===side;
    const palace=(side,r,c)=>c>=3&&c<=5&&(side===RED?r>=7&&r<=9:r>=0&&r<=2);
    const crossed=(side,r)=>side===RED?r<=4:r>=5;
    const forward=side=>side===RED?-1:1;
    const difficultyById=id=>DIFFICULTIES.find(level=>level.id===id)||DIFFICULTIES[2];
    const profileById=id=>AI_PROFILES.find(profile=>profile.id===id)||AI_PROFILES[0];
    const isAutoOpponent=()=>mode==="ai"||mode==="match";

    function loadMatchStats(){
      try{return JSON.parse(localStorage.getItem(MATCH_KEY))||{wins:0,losses:0,streak:0,best:0}}catch{return{wins:0,losses:0,streak:0,best:0}}
    }

    function saveMatchStats(){
      localStorage.setItem(MATCH_KEY,JSON.stringify(matchStats));
    }

    function initialBoard(){
      const b=Array.from({length:10},()=>Array(9).fill(null));
      const put=(r,c,side,type)=>b[r][c]={side,type,id:side+type+r+c};
      ["r","h","e","a","k","a","e","h","r"].forEach((t,c)=>put(0,c,BLACK,t));
      put(2,1,BLACK,"c");put(2,7,BLACK,"c");[0,2,4,6,8].forEach(c=>put(3,c,BLACK,"p"));
      ["r","h","e","a","k","a","e","h","r"].forEach((t,c)=>put(9,c,RED,t));
      put(7,1,RED,"c");put(7,7,RED,"c");[0,2,4,6,8].forEach(c=>put(6,c,RED,"p"));
      return b;
    }

    function resetGame(){
      board=initialBoard();turn=RED;selected=null;moves=[];history=[];gameOver=false;thinking=false;
      $("winnerLayer").classList.remove("show");render();
    }

    function startMatch(){
      mode="match";matchedOpponent=chooseMatchedOpponent();
      matchStatus=`已匹配：${matchedOpponent.name} · ${matchedOpponent.type==="bot"?"人机补位":"玩家"} · ${matchedOpponent.reason}`;
      resetGame();
    }

    function chooseMatchedOpponent(){
      if(matchStats.streak>=3)return{name:"天元制裁官",type:"bot",difficulty:"super",reason:"你已经连胜多场，系统安排超级人机压一压"};
      if(matchStats.streak<=-3)return{name:"迷路小兵",type:"bot",difficulty:"novice",reason:"你已经连输多场，系统安排弱智人机送一点机会"};
      if(Math.random()<.22){
        const bot=botPool[Math.floor(Math.random()*botPool.length)];
        return{...bot,type:"bot",reason:"匹配池暂时缺人，插入一点人机补位"};
      }
      const skill=Math.max(0,Math.min(6,2+Math.floor((matchStats.wins-matchStats.losses)/3)+Math.floor(Math.random()*3)-1));
      return{name:playerPool[Math.floor(Math.random()*playerPool.length)],type:"player",difficulty:DIFFICULTIES[skill].id,reason:"按当前战绩匹配到接近水平的玩家"};
    }

    function pseudoMoves(b,r,c){
      const p=b[r][c];if(!p)return[];
      const out=[];const add=(nr,nc)=>{if(inside(nr,nc)&&!own(b[nr][nc],p.side))out.push({r:nr,c:nc})};
      if(p.type==="r"){
        for(const [dr,dc] of dirs){let nr=r+dr,nc=c+dc;while(inside(nr,nc)){if(!b[nr][nc])out.push({r:nr,c:nc});else{if(enemy(b[nr][nc],p.side))out.push({r:nr,c:nc});break}nr+=dr;nc+=dc}}
      }
      if(p.type==="c"){
        for(const [dr,dc] of dirs){let nr=r+dr,nc=c+dc,screen=false;while(inside(nr,nc)){if(!screen&&!b[nr][nc])out.push({r:nr,c:nc});else if(!screen&&b[nr][nc])screen=true;else if(screen&&b[nr][nc]){if(enemy(b[nr][nc],p.side))out.push({r:nr,c:nc});break}nr+=dr;nc+=dc}}
      }
      if(p.type==="h"){
        for(const [dr,dc,lr,lc] of horseSteps){if(!b[r+lr]?.[c+lc])add(r+dr,c+dc)}
      }
      if(p.type==="e"){
        for(const [dr,dc,er,ec] of elephantSteps){const nr=r+dr,nc=c+dc;if(inside(nr,nc)&&!b[r+er][c+ec]&&(p.side===RED?nr>=5:nr<=4))add(nr,nc)}
      }
      if(p.type==="a"){
        for(const [dr,dc] of advisorSteps){const nr=r+dr,nc=c+dc;if(palace(p.side,nr,nc))add(nr,nc)}
      }
      if(p.type==="k"){
        for(const [dr,dc] of dirs){const nr=r+dr,nc=c+dc;if(palace(p.side,nr,nc))add(nr,nc)}
        let nr=r+forward(p.side);while(inside(nr,c)){if(b[nr][c]){if(b[nr][c].type==="k"&&enemy(b[nr][c],p.side))out.push({r:nr,c});break}nr+=forward(p.side)}
      }
      if(p.type==="p"){
        add(r+forward(p.side),c);
        if(crossed(p.side,r)){add(r,c-1);add(r,c+1)}
      }
      return out;
    }

    function findKing(b,side){
      for(let r=0;r<10;r++)for(let c=0;c<9;c++)if(b[r][c]?.side===side&&b[r][c].type==="k")return{r,c};
      return null;
    }

    function inCheck(b,side){
      const king=findKing(b,side);if(!king)return true;
      const other=side===RED?BLACK:RED;
      for(let r=0;r<10;r++)for(let c=0;c<9;c++)if(b[r][c]?.side===other&&pseudoMoves(b,r,c).some(m=>m.r===king.r&&m.c===king.c))return true;
      return false;
    }

    function movedBoard(b,from,to){
      const next=clone(b);next[to.r][to.c]=next[from.r][from.c];next[from.r][from.c]=null;return next;
    }

    function legalMovesFor(b,r,c){
      const p=b[r][c];if(!p)return[];
      return pseudoMoves(b,r,c).filter(to=>!inCheck(movedBoard(b,{r,c},to),p.side));
    }

    function allMoves(b,side){
      const out=[];
      for(let r=0;r<10;r++)for(let c=0;c<9;c++)if(b[r][c]?.side===side)for(const to of legalMovesFor(b,r,c))out.push({from:{r,c},to});
      return out;
    }

    function posName(pos){return `${"一二三四五六七八九"[pos.c]}${10-pos.r}`;}
    function sideName(side){return side===RED?"红方":"黑方";}
    function pieceLabel(p){return p?pieceText[p.side+p.type]:"";}

    function selectSquare(r,c){
      if(gameOver||thinking)return;
      const p=board[r][c];
      if(isAutoOpponent()&&turn===BLACK)return;
      if(p?.side===turn){selected={r,c};moves=legalMovesFor(board,r,c);render();return}
      if(selected&&moves.some(m=>m.r===r&&m.c===c))makeMove(selected,{r,c},"human");
    }

    function makeMove(from,to,actor){
      const moving=board[from.r][from.c],taken=board[to.r][to.c];
      history.push({board:clone(board),turn,moveLog:$("moveLog").innerHTML,actor});
      board[to.r][to.c]=moving;board[from.r][from.c]=null;selected=null;moves=[];
      const text=`${sideName(turn)} ${pieceLabel(moving)} ${posName(from)} → ${posName(to)}${taken?"，吃 "+pieceLabel(taken):""}`;
      const li=document.createElement("li");li.textContent=text;$("moveLog").prepend(li);
      if(taken?.type==="k"){finish(turn,`${sideName(turn)} 吃掉对方主帅。`);return}
      turn=turn===RED?BLACK:RED;
      const replies=allMoves(board,turn);
      if(!replies.length){finish(turn===RED?BLACK:RED,inCheck(board,turn)?`${sideName(turn)} 被将死。`:`${sideName(turn)} 无子可走。`);return}
      render();
      if(isAutoOpponent()&&turn===BLACK){thinking=true;render();setTimeout(aiMove,420)}
    }

    function finish(winner,copy){
      if(mode==="match")recordMatchResult(winner);
      gameOver=true;render();
      $("winnerTitle").textContent=`${sideName(winner)}获胜`;
      $("winnerCopy").textContent=copy;
      $("winnerLayer").classList.add("show");
    }

    function recordMatchResult(winner){
      if(winner===RED){matchStats.wins++;matchStats.streak=Math.max(1,matchStats.streak+1);matchStats.best=Math.max(matchStats.best,matchStats.streak);matchStatus=`本局获胜。当前${matchStats.streak>=0?"连胜":"连败"} ${Math.abs(matchStats.streak)} 场。`}
      else{matchStats.losses++;matchStats.streak=Math.min(-1,matchStats.streak-1);matchStatus=`本局落败。当前连败 ${Math.abs(matchStats.streak)} 场。`}
      saveMatchStats();
    }

    function scoreBoard(b,side){
      let score=0;
      for(let r=0;r<10;r++)for(let c=0;c<9;c++){const p=b[r][c];if(!p)continue;let v=values[p.type]+(p.type==="p"&&crossed(p.side,r)?60:0);score+=p.side===side?v:-v}
      if(inCheck(b,side===RED?BLACK:RED))score+=55;
      if(inCheck(b,side))score-=70;
      return score;
    }

    function moveScore(b,move,side){
      const moving=b[move.from.r][move.from.c],taken=b[move.to.r][move.to.c];
      let score=(taken?values[taken.type]*3:0)+scoreBoard(movedBoard(b,move.from,move.to),side);
      if(moving?.type==="p"&&crossed(side,move.to.r))score+=35;
      score-=Math.abs(move.to.c-4)*3;
      return score+Math.random()*12;
    }

    function configuredScore(b,move,side,config){
      return moveScore(b,move,side)+(Math.random()*config.noise);
    }

    function profileScore(b,move,side,profile){
      const next=movedBoard(b,move.from,move.to),taken=b[move.to.r][move.to.c];
      if(profile.style==="steady")return (taken?values[taken.type]*.8:0)+(Math.abs(move.to.c-4)<2?42:0)+(inCheck(next,side)?-180:0);
      if(profile.style==="deep")return scoreBoard(next,side)*.18+(inCheck(next,side===RED?BLACK:RED)?220:0);
      if(profile.style==="tactical")return (taken?values[taken.type]*1.4:0)+(inCheck(next,side===RED?BLACK:RED)?240:0)+(move.to.r>4?35:0);
      if(profile.style==="weird")return (Math.sin((move.to.r+1)*(move.to.c+2))*95)+(taken?values[taken.type]*.55:0);
      if(profile.style==="aggressive")return (taken?values[taken.type]*1.2:0)+(inCheck(next,side===RED?BLACK:RED)?180:0);
      if(profile.style==="defensive")return (inCheck(next,side)?-260:0)+(move.to.c>=3&&move.to.c<=5?22:0);
      if(profile.style==="endgame"){const king=findKing(next,side===RED?BLACK:RED);return king?(9-Math.abs(move.to.r-king.r)-Math.abs(move.to.c-king.c))*18:0}
      if(profile.style==="super")return (taken?values[taken.type]*1.6:0)+(inCheck(next,side===RED?BLACK:RED)?260:0)-Math.abs(move.to.c-4)*10;
      return 0;
    }

    function minimax(b,side,depth,maximizing,alpha,beta){
      const active=maximizing?side:(side===RED?BLACK:RED);
      const list=allMoves(b,active).sort((a,bm)=>moveScore(b,bm,side)-moveScore(b,a,side)).slice(0,18);
      if(depth===0||!list.length)return scoreBoard(b,side);
      if(maximizing){
        let best=-Infinity;for(const m of list){best=Math.max(best,minimax(movedBoard(b,m.from,m.to),side,depth-1,false,alpha,beta));alpha=Math.max(alpha,best);if(beta<=alpha)break}return best;
      }
      let best=Infinity;for(const m of list){best=Math.min(best,minimax(movedBoard(b,m.from,m.to),side,depth-1,true,alpha,beta));beta=Math.min(beta,best);if(beta<=alpha)break}return best;
    }

    function chooseAiMove(){
      const profile=mode==="ai"?profileById(aiProfile):{style:"balanced",difficulty:"custom"};
      const selectedDifficulty=profile.difficulty==="custom"?difficulty:profile.difficulty;
      const config=difficultyById(mode==="match"&&matchedOpponent?matchedOpponent.difficulty:selectedDifficulty);
      const list=allMoves(board,BLACK);
      if(Math.random()<config.random)return list[Math.floor(Math.random()*list.length)];
      const ranked=list.map(move=>{
        const base=config.depth>0?minimax(movedBoard(board,move.from,move.to),BLACK,config.depth,false,-Infinity,Infinity):scoreBoard(movedBoard(board,move.from,move.to),BLACK);
        return{move,score:base+configuredScore(board,move,BLACK,config)+profileScore(board,move,BLACK,profile)};
      }).sort((a,b)=>b.score-a.score);
      const top=ranked.slice(0,Math.max(1,config.top));
      return top[Math.floor(Math.random()*top.length)].move;
    }

    function aiMove(){
      if(gameOver||turn!==BLACK)return;
      const move=chooseAiMove();thinking=false;
      if(move)makeMove(move.from,move.to,"ai");
    }

    function undoMove(){
      if(thinking||!history.length)return;
      let last=history.pop();
      if(isAutoOpponent()&&last?.actor==="ai"&&history.length)last=history.pop();
      if(!last)return;
      board=clone(last.board);turn=last.turn;selected=null;moves=[];gameOver=false;$("moveLog").innerHTML=last.moveLog;$("winnerLayer").classList.remove("show");render();
    }

    function renderBoard(){
      const boardEl=$("board");boardEl.innerHTML="";
      for(let r=0;r<10;r++)for(let c=0;c<9;c++){
        const palaceClass=palace(RED,r,c)?"palace-red":palace(BLACK,r,c)?"palace-black":"";
        const cell=document.createElement("button");cell.className=`cell ${r===4||r===5?"river":""} ${palaceClass}`;cell.type="button";cell.dataset.r=r;cell.dataset.c=c;cell.setAttribute("aria-label",`第${r+1}行第${c+1}列`);cell.onclick=()=>selectSquare(r,c);
        if(moves.some(m=>m.r===r&&m.c===c))cell.classList.add(board[r][c]?"capture":"hint");
        boardEl.appendChild(cell);
      }
      for(let r=0;r<10;r++)for(let c=0;c<9;c++){const p=board[r][c];if(!p)continue;const btn=document.createElement("button");btn.type="button";btn.className=`piece ${p.side===RED?"red":"black"}${selected?.r===r&&selected?.c===c?" selected":""}${thinking&&p.side===BLACK?" ai-turn":""}`;btn.textContent=pieceLabel(p);btn.style.left=`${(c+.5)/9*100}%`;btn.style.top=`${(r+.5)/10*100}%`;btn.setAttribute("aria-label",`${sideName(p.side)}${pieceName[p.type]}`);btn.onclick=()=>selectSquare(r,c);$("boardWrap").appendChild(btn)}
    }

    function renderCaptured(){
      const reds=[],blacks=[];
      const initial={rk:1,ra:2,re:2,rh:2,rr:2,rc:2,rp:5,bk:1,ba:2,be:2,bh:2,br:2,bc:2,bp:5};
      const now={};
      for(let r=0;r<10;r++)for(let c=0;c<9;c++){const p=board[r][c];if(p)now[p.side+p.type]=(now[p.side+p.type]||0)+1}
      Object.keys(initial).forEach(k=>{for(let i=0;i<initial[k]-(now[k]||0);i++)(k[0]===RED?blacks:reds).push(pieceText[k])});
      $("redCaptured").textContent=reds.join(" ")||"—";$("blackCaptured").textContent=blacks.join(" ")||"—";
    }

    function render(){
      document.querySelectorAll(".piece").forEach(p=>p.remove());
      renderBoard();renderCaptured();
      const activeProfile=profileById(aiProfile);
      const activeLevel=difficultyById(mode==="match"&&matchedOpponent?matchedOpponent.difficulty:activeProfile.difficulty==="custom"?difficulty:activeProfile.difficulty);
      $("modeHud").textContent=mode==="ai"?"人机对战":mode==="match"?"匹配对战":"双人对战";$("difficultyHud").textContent=activeLevel.label;
      $("turnHud").textContent=sideName(turn);$("statusText").innerHTML=thinking?`<b>黑方</b> ${mode==="match"?"对手":"人机"}正在思考。`:`<b>${sideName(turn)}</b> ${selected?"选择落点。":"请选择棋子。"}`;
      const checked=inCheck(board,turn);$("checkText").textContent=checked?`${sideName(turn)}被将军`:"未将军";
      $("coach").textContent=mode==="ai"?"你执红先走，可以在 AI 对手里直接选择不同风格。":mode==="match"?"匹配模式会看你的连胜连败调度对手，特殊对手会显示在当前对手里。":"双人对战适合同屏轮流走，红方先行。";
      $("matchStatus").textContent=matchStatus;
      $("opponentInfo").textContent=mode==="match"&&matchedOpponent?`${matchedOpponent.name} · ${matchedOpponent.type==="bot"?"人机补位":"匹配玩家"} · ${activeLevel.label}`:mode==="ai"?`${activeProfile.label} · ${activeLevel.label}`:"同屏玩家 · 不使用人机";
      $("matchRecord").textContent=`${matchStats.wins} 胜 ${matchStats.losses} 负 · ${matchStats.streak>=0?"连胜":"连败"} ${Math.abs(matchStats.streak)} · 最佳 ${matchStats.best}`;
      document.querySelectorAll("#modeButtons button").forEach(b=>b.classList.toggle("active",b.dataset.mode===mode));
      document.querySelectorAll("#difficultyButtons button").forEach(b=>{b.classList.toggle("active",b.dataset.difficulty===difficulty);b.disabled=mode!=="ai"});
      document.querySelectorAll("#aiProfileButtons button").forEach(b=>{b.classList.toggle("active",b.dataset.aiProfile===aiProfile);b.disabled=mode!=="ai"});
    }

    $("modeButtons").onclick=e=>{if(!e.target.dataset.mode)return;mode=e.target.dataset.mode;if(mode==="match")startMatch();else{matchedOpponent=null;matchStatus=mode==="ai"?"人机练习已准备好。":"双人同屏对局已准备好。";resetGame()}};
    $("difficultyButtons").onclick=e=>{if(!e.target.dataset.difficulty||mode!=="ai")return;difficulty=e.target.dataset.difficulty;render()};
    $("aiProfileButtons").onclick=e=>{if(!e.target.dataset.aiProfile||mode!=="ai")return;aiProfile=e.target.dataset.aiProfile;resetGame()};
    $("matchButton").onclick=startMatch;$("newGame").onclick=()=>mode==="match"?startMatch():resetGame();$("playAgain").onclick=()=>mode==="match"?startMatch():resetGame();$("undoMove").onclick=undoMove;
    resetGame();
  </script>
</body>
</html>
